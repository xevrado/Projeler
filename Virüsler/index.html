<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virüsler - Zihin Haritası</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f7f8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .iframe-container {
      width: 100%;
      max-width: 1100px;
      height: 80vh;
      min-height: 580px;
      background-color: #ffffff;
      border: 1px solid #d1e0e2;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(19, 70, 73, 0.08);
      overflow: hidden;
      /* Taşan alt çubuğu gizler */
      position: relative;
    }

    .iframe-container iframe {
      width: 100%;
      height: calc(100% + 50px);
      /* Alt çubuk yüksekliği kadar aşağı uzatır */
      border: none;
      display: block;
    }

    /* Alt Bilgi (Footer) Alanı */
    .footer {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .footer-line {
      width: 64px;
      height: 1.5px;
      background-color: #cbd5e1;
      border-radius: 2px;
    }

    .footer-text {
      font-size: 13.5px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.4px;
    }
  </style>
</head>

<body>

  <div class="iframe-container">
    <iframe src="https://app.xmind.com/embed/LSsKgeTE?sheet-id=59fb78ea-077c-4b42-8681-b2e147528de7"
      allowfullscreen="true" loading="lazy">
    </iframe>
  </div>

  <footer class="footer">
    <div class="footer-line"></div>
    <p class="footer-text">Ömer Yener • Biyoloji Ödevi</p>
  </footer>

</body>

</html>
